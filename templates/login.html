<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ app_name }}</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-color);
            margin: 0;
        }
        .login-box {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }
        .login-box h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            outline: none;
            font-family: inherit;
        }
        .form-group input:focus {
            border-color: var(--primary-color);
        }
        .btn-block {
            width: 100%;
            margin-top: 1rem;
        }
        .error-msg {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            text-align: center;
            border: 1px solid #ef4444;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>{{ t.login_title }}{{ app_name }}</h1>
        
        {% if let Some(err) = error %}
        <div class="error-msg">
            {{ err }}
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">{{ t.login_user }}</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">{{ t.login_pass }}</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">{{ t.login_btn }}</button>
        </form>
        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="/" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">{{ t.login_back }}</a>
        </div>
    </div>
</body>
</html>
