<nav class="navbar">
    <div class="navbar-inner">
        <a href="/" class="navbar-brand">
            <span class="brand-icon">🦀</span>
            <span class="brand-name">{{ app_name }}</span>
            <span class="brand-version">v{{ paas_version }}</span>
        </a>
        <div class="navbar-links">
            <a href="/docs" class="nav-link">{{ t.nav_docs }}</a>
            {% if let Some(u) = user %}
                <a href="/dashboard" class="nav-link">{{ t.nav_dashboard }}</a>
                <span style="color: var(--text-muted); margin-left: 1rem;">@{{ u.username }}</span>
                <form action="/logout" method="POST" style="display:inline; margin-left: 1rem;">
                    <button type="submit" class="btn btn-sm btn-secondary">{{ t.nav_logout }}</button>
                </form>
            {% else %}
                <a href="/login" class="btn btn-sm btn-primary" style="margin-left: 1rem;">{{ t.nav_login }}</a>
            {% endif %}
            <div style="margin-left: 1.5rem; display: inline-flex; gap: 0.5rem; align-items: center;">
                <a href="/set_lang?lang=es" onclick="this.href='/set_lang?lang=es&next=' + encodeURIComponent(window.location.pathname + window.location.search)" style="text-decoration: none; color: var(--text-muted); font-size: 0.9rem;" title="Español">ES</a>
                <span style="color: var(--border-color);">|</span>
                <a href="/set_lang?lang=en" onclick="this.href='/set_lang?lang=en&next=' + encodeURIComponent(window.location.pathname + window.location.search)" style="text-decoration: none; color: var(--text-muted); font-size: 0.9rem;" title="English">EN</a>
            </div>
        </div>
    </div>
</nav>
