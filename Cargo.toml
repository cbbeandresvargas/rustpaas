[package]
name = "mypaas"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mypaas"
path = "src/main.rs"

[dependencies]
# HTTP server & routing
axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "chrono", "uuid"] }

# S3 engine
s3s = { version = "0.11" }
s3s-fs = { version = "0.11" }

# Templating
askama = { version = "0.12" }
askama_axum = { version = "0.4" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

# Logging & tracing
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde", "fast-rng"] }
anyhow = { version = "1" }
thiserror = { version = "1" }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = { version = "0.15" }
rand = { version = "0.8" }
bytes = { version = "1" }
futures = { version = "0.3" }
tokio-stream = { version = "0.1" }
http-body-util = { version = "0.1" }
rusqlite = { version = "0.31", features = ["bundled"] }
bcrypt = "0.19.3"
axum-extra = { version = "0.12.6", features = ["cookie"] }
# Bundle extraction (tar.gz deploy)
tar = "0.4"
flate2 = "1"
# Process metrics (CPU / RAM)
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
# Resource limits
libc = "0.2"

[dev-dependencies]
tempfile = "3"
