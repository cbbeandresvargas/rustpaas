name: Deploy to RustPaaS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_NAME: "mi-app"       # Nombre de tu app / subdominio
  RUSTPAAS_URL: "https://paas.tudominio.com"  # URL de tu servidor RustPaaS
  # BUNDLE_ASSETS: "public"    # Descomenta si tienes carpeta de assets (ej. "public" o "static")

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      # ── Opción A: Solo el binario (app sin archivos de assets) ────────────
      - name: Deploy binary
        if: ${{ !env.BUNDLE_ASSETS }}
        run: |
          BINARY_PATH="./target/x86_64-unknown-linux-gnu/release/${{ env.PROJECT_NAME }}"

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${{ env.RUSTPAAS_URL }}/api/deploy" \
            -H "Authorization: Bearer ${{ secrets.PAAS_API_KEY }}" \
            -F "name=${{ env.PROJECT_NAME }}" \
            -F "binary=@${BINARY_PATH}")

          STATUS=$(echo "$RESPONSE" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS:[0-9]*//')

          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 201 ]; then
            echo "✅ Deploy exitoso: $BODY"
          else
            echo "❌ Error HTTP $STATUS: $BODY" && exit 1
          fi

      # ── Opción B: Bundle (binario + carpeta de assets en tar.gz) ──────────
      # Para activar: define BUNDLE_ASSETS en env (ej. "public" o "static dist")
      # El bundle se detecta automáticamente por magic bytes, no hace falta cambiar nada en el servidor.
      - name: Deploy bundle (binary + assets)
        if: ${{ env.BUNDLE_ASSETS }}
        run: |
          BINARY_PATH="./target/x86_64-unknown-linux-gnu/release/${{ env.PROJECT_NAME }}"

          # Empacar binario + carpetas de assets en un tar.gz
          tar -czf bundle.tar.gz \
            -C ./target/x86_64-unknown-linux-gnu/release "${{ env.PROJECT_NAME }}" \
            ${{ env.BUNDLE_ASSETS }}

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${{ env.RUSTPAAS_URL }}/api/deploy" \
            -H "Authorization: Bearer ${{ secrets.PAAS_API_KEY }}" \
            -F "name=${{ env.PROJECT_NAME }}" \
            -F "binary=@bundle.tar.gz")

          STATUS=$(echo "$RESPONSE" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS:[0-9]*//')

          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 201 ]; then
            echo "✅ Bundle deploy exitoso: $BODY"
          else
            echo "❌ Error HTTP $STATUS: $BODY" && exit 1
          fi
